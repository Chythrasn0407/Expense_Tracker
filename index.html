<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple personal expense tracker." />
    <title>Ledger | Expense Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="Ledger home">
          <span class="brand-mark" aria-hidden="true">L</span>
          <span>ledger</span>
        </a>
        <span class="local-note"><span class="status-dot" aria-hidden="true"></span>Private on this device</span>
      </header>

      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">Personal spending log</p>
        <h1 id="page-title">Make every expense<br /><em>easy to see.</em></h1>
        <p class="intro-copy">A calm place to keep today’s spending in check.</p>
      </section>

      <section class="dashboard" aria-label="Expense dashboard">
        <article class="total-card">
          <div>
            <p class="card-label">Total spent</p>
            <p class="total-amount" id="total-amount">$0.00</p>
          </div>
          <span class="total-icon" aria-hidden="true">&#8599;</span>
        </article>

        <form class="expense-form" id="expense-form">
          <div class="form-heading">
            <div>
              <p class="card-label">New entry</p>
              <h2>Log an expense</h2>
            </div>
            <span class="form-number">01</span>
          </div>

          <div class="form-grid">
            <label class="field description-field">
              <span>What was it for?</span>
              <input id="description" name="description" type="text" placeholder="e.g. Lunch with team" maxlength="60" required />
            </label>

            <label class="field amount-field">
              <span>Amount</span>
              <span class="input-with-prefix">
                <span aria-hidden="true">&#8377;</span>
                <input id="amount" name="amount" type="number" min="0.01" step="0.01" placeholder="0.00" inputmode="decimal" required />
              </span>
            </label>

            <label class="field">
              <span>Category</span>
              <select id="category" name="category">
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Home">Home</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Other">Other</option>
              </select>
            </label>

            <label class="field">
              <span>Date</span>
              <input id="date" name="date" type="date" required />
            </label>
          </div>

          <button class="primary-button" type="submit">
            <span>Add expense</span>
            <span aria-hidden="true">&#8594;</span>
          </button>
          <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="expenses-section" aria-labelledby="expenses-title">
        <div class="section-heading">
          <div>
            <p class="card-label">Your activity</p>
            <h2 id="expenses-title">All expenses <span id="expense-count">0</span></h2>
          </div>
          <button class="clear-button" id="clear-button" type="button" hidden>Clear all</button>
        </div>

        <div class="expense-list" id="expense-list" aria-live="polite"></div>
        <div class="empty-state" id="empty-state">
          <span class="empty-mark" aria-hidden="true">+</span>
          <h3>Nothing logged yet</h3>
          <p>Your recent spending will appear here.</p>
        </div>
      </section>
    </main>
  </body>
</html>
